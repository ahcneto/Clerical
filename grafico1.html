<!DOCTYPE html>
<html>
<head>
<title>Meu primeiro gráfico</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Vendas do ano</h2>

<canvas id="meuGrafico"></canvas>

<script>

const ctx = document.getElementById('meuGrafico');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr'],
        datasets: [{
            label: 'Vendas',
            data: [10, 20, 30, 25]
        }]
    }
});

</script>

</body>
</html>
