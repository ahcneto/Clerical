</head>

<div class="container py-4">

    <div class="d-flex justify-content-between mb-4">
        <div>
            <h1 class="fw-bold">Encontros Formativos</h1>
            <p id="total-encontros" class="text-muted"></p>
        </div>

        <button class="btn btn-orange" onclick="openEventModal()">
            <i class="bi bi-plus-lg"></i> Novo Encontro
        </button>
    </div>


<div class="row mb-4">
    
  <!--   <div class="col-md-5">
        <input type="text"
               id="searchEvent"
               class="form-control search-box"
               placeholder="Buscar encontro...">
    </div> -->

   <div class="col-md-2">
    <select id="filterAno" class="form-select">
        <option value="">Todos os anos</option>
    </select>
</div>

<div class="col-md-2">
    <select id="filterMes" class="form-select">
        <option value="">Todos os meses</option>
        <option value="1">Janeiro</option>
        <option value="2">Fevereiro</option>
        <option value="3">Março</option>
        <option value="4">Abril</option>
        <option value="5">Maio</option>
        <option value="6">Junho</option>
        <option value="7">Julho</option>
        <option value="8">Agosto</option>
        <option value="9">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
    </select>
</div>

    <div class="col-md-4">
        <select id="filterEventGrupo" class="form-select">
            <option value="">Todos os grupos</option>
            <option value="Todos">Todos</option>
            <option value="Diácono">Diácono</option>
            <option value="Candidato">Candidato</option>
            <option value="Vocacionado">Vocacionado</option>
        </select>
    </div>

</div>

    <div id="eventsContainer"></div>
</div>

<div id="eventModal" class="custom-modal-overlay">
    <div class="custom-modal">

        <div class="modal-header-custom">
            <h3 id="eventModalTitle">Novo Encontro</h3>
            <button class="close-btn" onclick="closeEventModal()">×</button>
        </div>

        <div class="modal-body-custom">
            <div class="row g-3">

                <div class="col-12">
                    <label>Título *</label>
                    <input id="eventTitulo" class="form-control">
                </div>

                <div class="col-12">
                    <label>Descrição</label>
                    <textarea id="eventDescricao" class="form-control"></textarea>
                </div>

                <div class="col-md-6">
                    <label>Data *</label>
                    <input id="eventData" type="date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label>Horário</label>
                    <input id="eventHora" type="time" class="form-control">
                </div>

                <div class="col-12">
                    <label>Local</label>
                    <input id="eventLocal" class="form-control">
                </div>

                <div class="col-md-6">
                    <label>Grupo Alvo</label>
                    <select id="eventGrupo" class="form-select">
                        <option>Todos</option>
                        <option>Diácono</option>
                        <option>Candidato</option>
                        <option>Vocacionado</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Situação</label>
                    <select id="eventStatus" class="form-select">
                        <option>Agendado</option>
                        <option>Realizado</option>
                        <option>Cancelado</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="modal-footer-custom">
            <button class="btn btn-light" onclick="closeEventModal()">Cancelar</button>
            <button class="btn btn-orange" onclick="saveEvent()">Salvar</button>
        </div>

    </div>
</div>

<script src="js/event-modal.js"></script>
<script src="js/events.js"></script>
</body>
</html>
