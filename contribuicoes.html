<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contribuições</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-bank"></i> Escola Diaconal
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house"></i> Início</a></li>
                <li class="nav-item"><a class="nav-link" href="membros.html"><i class="bi bi-people"></i> Membros</a></li>
                <li class="nav-item"><a class="nav-link" href="encontros.html"><i class="bi bi-calendar-event"></i> Encontros</a></li>
                <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-cash"></i> Contribuições</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bar-chart"></i> Relatórios</a></li>
            </ul>

            <div class="user-info">
                <span class="avatar">A</span> Aristeu Holanda
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h1 class="fw-bold">Contribuições Financeiras</h1>
        <p class="text-muted">Controle mensal de contribuições</p>
    </div>
	
	<div class="row mb-4 g-3 align-items-center">

    <div class="col-md-2">
        <select id="filterMesContrib" class="form-select">
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6" selected>Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
        </select>
    </div>

    <div class="col-md-2">
        <select id="filterAnoContrib" class="form-select">
            <option>2025</option>
            <option selected>2026</option>
        </select>
    </div>

    <div class="col-md-2">
        <select id="filterGrupoContrib" class="form-select">
            <option value="">Todos os grupos</option>
            <option value="Diácono">Diácono</option>
            <option value="Candidato">Candidato</option>
            <option value="Vocacionado">Vocacionado</option>
        </select>
    </div>

    <div class="col-md-4">
        <input type="text"
               id="searchContrib"
               class="form-control"
               placeholder="Buscar por nome...">
    </div>

    <div class="col-md-2">
        <button class="btn btn-orange w-100" onclick="saveContributions()">
            Salvar
        </button>
    </div>

</div>

<div class="contribution-card">

    <div class="d-flex justify-content-between mb-4">
        <h3 id="competenciaTitulo">Junho 2026</h3>
        <span id="resumoContrib" class="badge-tag tag-green">1/5 contribuíram</span>
    </div>

    <div id="contributionsContainer"></div>

</div>

</div>

<script src="js/contributions.js"></script>
</body>
</html>
